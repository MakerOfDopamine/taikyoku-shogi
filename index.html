<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <style>
        #grid {
            display: inline-grid;
            grid-template-columns: repeat(36, 26px);
            gap: 1px;
            background: #333;
            padding: 1px;
        }
        .cell {
            width: 26px;
            height: 23px;
            background: #998438;
            border: none;
            text-align: center;
            font-size: 12px;
            align-content: center;
        }
        .section {
            display: inline-block;
            border: 4px solid rgb(194, 186, 186);
            border-radius: 8px;
            padding: 10px;
        }

        button {
            font: inherit;
        }
    </style>
</head>
<body style="background-color: white; font-family: 'Courier New', Courier, monospace;">
    <div id="main-container" style="display: flex; flex-direction: row; gap: 16px">
        <div id="side-panel-left" style="flex: 2; min-width: 0; border: 4px solid black; border-radius: 8px; padding: 16px; display: flex; flex-direction: column;">
            <div id="game-info-panel" class="section">
                <p id="move"></p>
                <p id="stm"></p>
            </div>
            <div id="game-option-select" style="display: flex; margin-top: auto;">
                <button onclick="restart_game()" style="width: 100%; height: 40px; border-radius: 5px; border: none; background-color: #e4b476;">Restart Game</button>
            </div>
        </div>
        <div id="grid" style="flex: 0 0 500px"></div>
        <div id="side-panel" style="flex: 3; min-width: 0; border: 4px solid black; border-radius: 8px; padding: 16px; display: flex; flex-direction: column;">
            <div id="inspector" class="section">
                <h3 style="white-space: nowrap; margin-top: 5px; margin-bottom: 5px;">Piece Information</h3>
                <div id="piece-info"></div>
                <div id="piece-move-grid" style="display: none; gap: 1px; background: #333;"></div>
            </div>
            <br><br>
            <div id="lookup" class="section">
                <form id="lookup-form">
                    <input type="text" id="piece-id-lookup"><br>
                    <button type="submit" style="padding-top: 3px;">Find Piece</button>
                </form>
            </div><br><br>
            <button id="testing" onclick="alert('hi!')">
                Hello!
            </button>
            <input type="file" id="gamefile-upload" accept=".tkn">
        </div>
    </div>
    
    <!-- Importing javascripts -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <script src="engine.js" defer></script>
    <script src="game.js" defer></script>
    <script src="grid.js" defer></script>
    
</body>
</html>
